<svg xmlns="http://www.w3.org/2000/svg" width="180" height="56" viewBox="790 2540 5090 1585" role="img" aria-label="Sigphase company logo" class="sigphase-brand-logo">
  <title>Sigphase</title>
  <style>
    .navbar-brand .sigphase-brand-logo { display: block; width: 180px; height: 56px; max-width: 100%; }
    .dark .sigphase-brand-logo .sigphase-brand-artwork { filter: invert(1); }
    @media (max-width: 380px) { .navbar-brand .sigphase-brand-logo { width: 150px; height: 47px; } }
  </style>
  <!-- Display the supplied transparent logo at its original proportions. -->
  <!-- The viewBox removes the source canvas whitespace without altering the artwork. -->
  <image class="sigphase-brand-artwork" href="/brand/sigphase-logo.png" width="6666" height="6666" />
</svg>
